{% extends 'inicio/index.html' %}
{% load humanize %}
{% block content %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>



<!-- MENUS -->


<div class="row mb-3">

    <!-- Mes -->
    <div class="col-md-4">
        <form id="filtroForm" method="GET">

            <label>Mes</label>
            <select name="mes" class="form-control" onchange="this.form.submit()">
                <option value="">Todos</option>

                {% for mes in meses_disponibles %}
                <option value="{{ mes }}"
                    {% if mes == mes_seleccionado %}
                    selected
                    {% endif %}
                >
                    {{ mes }}
                </option>
                {% endfor %}
            </select>
    </div>

    <!-- Estaciones -->
    <div class="col-md-6">

        <label>Estaciones</label>

        <select
            name="estacion"
            multiple
            class="form-control"
            size="8">

            {% for estacion in estaciones_origen %}
            <option
                value="{{ estacion }}"
                {% if estacion in estaciones_seleccionadas %}
                selected
                {% endif %}
            >
                {{ estacion }}
            </option>
            {% endfor %}
        </select>

    </div>

    <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100">
            Filtrar
        </button>
    </div>

    </form>

</div>

<!-- FIN MENUS -->


<div>
    <form method="GET">
        <select name="estacion" multiple class="form-control">
            {% for est in estaciones_origen %}
                <option value="{{ est }}"
                {% if est in estaciones_seleccionadas %}
                    selected
                {% endif %}
                >
                    {{ est }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Filtrar</button>
    </form>


    <div style="width: 30%;">
        <h3>Viajes por Origen (Top 10)</h3>
        <canvas id="graficoOrigen"></canvas>

    <script>
    const viajesOrigen = {{ viajes_por_origen|safe }};

    new Chart(document.getElementById('graficoOrigen'), {
        type: 'bar',
        data: {
            labels: Object.keys(viajesOrigen),
            datasets: [{
                label: "Cantidad de viajes",
                data: Object.values(viajesOrigen),
                backgroundColor: '#6670FF'
            }]
        },
        options: {
            indexAxis: 'y', // barras horizontales
            responsive: true,
            plugins: {
                legend: { 
                    display: false, 
                },
                title: { display: true, text: 'Viajes por Origen' },
                datalabels: {
                    anchor: 'end',
                    align: 'right',
                    color: '#000',
                    font: {
                        weight: 'bold',
                        size: "9",
                    },
                    formatter: function(value) {
                        return value.toLocaleString(); // separador de miles
                    }
                }
            }
        },
        plugins: [ChartDataLabels]
    });
    </script>
    </div>

    
    <div style="width: 30%;">
        <h3>Viajes por Destino (Top 20)</h3>
        <canvas id="graficoDestino"></canvas>

    <script>
    const viajesDestino = {{ viajes_por_destino|safe }};

    new Chart(document.getElementById('graficoDestino'), {
        type: 'bar',
        data: {
            labels: Object.keys(viajesDestino),
            datasets: [{
                label: "Cantidad de viajes",
                data: Object.values(viajesDestino),
                backgroundColor: '#6670FF'
            }]
        },
        options: {
            indexAxis: 'y', // barras horizontales
            responsive: true,
            plugins: {
                legend: { display: false },
                title: { display: true, text: 'Viajes x Destino' },
                datalabels: {
                    anchor: 'end',
                    align: 'right',
                    color: '#000',
                    font: { weight: 'bold' },
                    formatter: function(value) {
                        return value.toLocaleString(); // separador de miles
                    }
                }
            }
        },
        plugins: [ChartDataLabels]
    });
    </script>
    </div>
</div>


<canvas id="viajesPorMes" height="120"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const ctx = document.getElementById('viajesPorMes');
new Chart(ctx, {
  type: 'bar',
  data: {
    labels: {{ meses_labels|safe }},
    datasets: [{
      label: 'Viajes por mes',
      data: {{ viajes_values|safe }},
      backgroundColor: '#4b9cd3'
    }]
  },
  options: {
    plugins: { legend: { display: false } },
    scales: {
      y: { beginAtZero: true }
    }
  }
});
</script>


{% endblock content %}
